<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adaptive Study Quiz</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <h1>Adaptive Study Quiz</h1>
      <p id="meta"></p>
    </header>

    <!-- Quiz View -->
    <main class="card" id="quiz-view">
      <div class="badges">
        <span id="question-topic" class="badge"></span>
        <span id="question-difficulty" class="badge badge-secondary"></span>
      </div>
      <h2 id="question-text"></h2>
      <ul id="choices" class="choices"></ul>
      <div class="controls">
        <button id="reveal-btn" class="btn primary">Check Answer</button>
        <button id="next-btn" class="btn" disabled>Next Question</button>
      </div>
      <section id="feedback" class="feedback hidden">
        <p id="result-label"></p>
        <p id="explanation-correct"></p>
        <p id="explanation-wrong"></p>
      </section>
    </main>

    <!-- Results View -->
    <section id="results-view" class="card hidden">
      <h2>Quiz Complete</h2>
      <div class="score-board">
        <div class="score-item">
          <span class="score-number" id="score-correct">0</span>
          <span class="score-label">Correct</span>
        </div>
        <div class="score-item">
          <span class="score-number" id="score-incorrect">0</span>
          <span class="score-label">Incorrect</span>
        </div>
        <div class="score-item">
          <span class="score-number" id="score-percent">0%</span>
          <span class="score-label">Score</span>
        </div>
      </div>
      <div class="topic-breakdown" id="topic-breakdown"></div>
      <div class="controls">
        <button id="retry-btn" class="btn primary">Retry Quiz</button>
        <button id="export-btn" class="btn">Download Results (JSON)</button>
      </div>
    </section>

    <footer class="footer">
      <span id="progress"></span>
    </footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
